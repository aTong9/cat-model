<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Cat 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1a2e; overflow:hidden; font-family:sans-serif; }
  canvas { display:block; }
  #info {
    position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
    color:rgba(255,255,255,0.5); font-size:12px; pointer-events:none;
    z-index:10;
  }
  #controls {
    position:fixed; top:12px; right:12px;
    background:rgba(0,0,0,0.6); border-radius:8px; padding:10px 14px;
    color:#fff; font-size:13px; line-height:1.8; z-index:10;
    display:none; /* 批量模式下隐藏 */
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info"></div>
<div id="controls"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ============================================================
// 参数解析
// ============================================================
const params = new URLSearchParams(location.search);
const BATCH = params.get('batch') === '1';

const furColor   = params.get('fur')   || 'Orange';
const eyeType    = params.get('eyes')  || 'Original';
const faceType   = params.get('face')  || 'Smile';
const gearType   = params.get('gear')  || '';
const bgType     = params.get('bg')    || 'Blue Gradient';
const special    = params.get('special') || '';

// ============================================================
// 数据映射（保持与 config.js 一致）
// ============================================================
const FUR_COLORS = {
  'Black':                  { base:'#2d2d2d', accent:'#1a1a1a', pattern:'solid' },
  'Blue Lightning Tabby':   { base:'#5b7cb5', accent:'#ffd700', pattern:'striped', stripeColor:'#ffe44d' },
  'Calico':                 { base:'#ffffff', accent:'#f4a460', pattern:'patches', patchColors:['#f4a460','#2d2d2d'] },
  'Golden':                 { base:'#daa520', accent:'#ffd700', pattern:'solid' },
  'Gray':                   { base:'#808080', accent:'#696969', pattern:'solid' },
  'Leopard Patterned':      { base:'#d2a679', accent:'#8b6914', pattern:'spots', spotColor:'#5c3d1a' },
  'Orange':                 { base:'#f4a460', accent:'#ff8c00', pattern:'solid' },
  'Tuxedo':                 { base:'#2d2d2d', accent:'#ffffff', pattern:'tuxedo', chestColor:'#ffffff' },
};

const EYE_STYLES = {
  'Alert':      { size:1.2, pupilSize:0.25, openRatio:1.0, ringColor:null },
  'Blue Ring':  { size:1.0, pupilSize:0.3,  openRatio:1.0, ringColor:'#4488ff' },
  'Original':   { size:1.0, pupilSize:0.35, openRatio:0.85, ringColor:null },
  'Relaxed':    { size:0.9, pupilSize:0.35, openRatio:0.55, ringColor:null },
  'Sunglasses': { size:1.0, isAccessory:'sunglasses', lensColor:'#1a1a2e' },
  'VR':         { size:1.0, isAccessory:'vr_headset', headsetColor:'#444466' },
};

const FACE_EXPRESSIONS = {
  'Excited':    { mouthType:'open',    mouthScale:1.3, eyeBrowAngle:-0.25, blushIntensity:0.6 },
  'Smile':      { mouthType:'smile',   mouthScale:1.0, eyeBrowAngle:0,     blushIntensity:0.3 },
  'Whistling':  { mouthType:'whistle', mouthScale:0.6, eyeBrowAngle:0.1,   blushIntensity:0 },
  'Wow':        { mouthType:'open',    mouthScale:1.8, eyeBrowAngle:0.3,   blushIntensity:0 },
  'Yum':        { mouthType:'tongue',  mouthScale:1.1, eyeBrowAngle:-0.1,  blushIntensity:0.4 },
};

const BACKGROUNDS = {
  'Blue Gradient':               { top:'#1a1a4e', bottom:'#4a90d9' },
  'Green Gradient':              { top:'#0d3b0d', bottom:'#4caf50' },
  'Green To Blue Gradient':      { top:'#0d3b0d', bottom:'#4a90d9' },
  'Orange Gradient':             { top:'#5c2a0a', bottom:'#ff8c00' },
  'Pink To Orange Gradient':     { top:'#ff69b4', bottom:'#ff8c00' },
  'Purple Gradient':             { top:'#2d0a3d', bottom:'#9b59b6' },
  'Red To Pink Gradient':        { top:'#8b0000', bottom:'#ff69b4' },
  'Yellow To Green Gradient':    { top:'#ffd700', bottom:'#4caf50' },
};

const SPECIALS = {
  'Fitness Guru':       { skyColor:'#87ceeb', groundColor:'#90ee90', objects:['dumbbell'] },
  'Galactic Voyage':    { skyColor:'#0a0a2e', groundColor:null, objects:['stars','planet'] },
  'Golden General':     { skyColor:'#ffd700', groundColor:'#000000', objects:['armor','banner'] },
  'Onsen journey':      { skyColor:'#ffe4b5', groundColor:'#87ceeb', objects:['towel','steam'] },
  'Realm of Mt.Fuji':   { skyColor:'#ffe4e1', groundColor:'#8fbc8f', objects:['mountain'] },
  'Thunderous Might':   { skyColor:'#2c3e50', groundColor:'#34495e', objects:['lightning'] },
  'Time Traveler':      { skyColor:'#4a0080', groundColor:'#1a0030', objects:['clock','portal'] },
};

const isFullScene = special === 'Galactic Voyage' || special === 'Golden General';

// ============================================================
// Scene Setup
// ============================================================
const SIZE = 1024;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true, preserveDrawingBuffer:true });
renderer.setSize(SIZE, SIZE);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();

// 相机
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 50);
camera.position.set(0, 0.3, 5.5);
camera.lookAt(0, -0.1, 0);

// 光照
const ambientLight = new THREE.AmbientLight('#ffffff', 1.5);
scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight('#ffffff', 3);
keyLight.position.set(5, 8, 5);
keyLight.castShadow = true;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight('#aaccff', 1.5);
fillLight.position.set(-3, 2, -2);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight('#ffffff', 1.8);
rimLight.position.set(0, 1, -4);
scene.add(rimLight);

// ============================================================
// 工具函数
// ============================================================
function hexToThree(hex) {
  return new THREE.Color(hex);
}

function createFurTexture(furInfo) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');

  ctx.fillStyle = furInfo.base;
  ctx.fillRect(0, 0, 256, 256);

  switch (furInfo.pattern) {
    case 'striped': {
      ctx.strokeStyle = furInfo.stripeColor || '#000';
      ctx.lineWidth = 4;
      for (let y = 20; y < 256; y += 28) {
        ctx.beginPath();
        for (let x = 0; x < 256; x += 8) {
          const offset = Math.sin(x * 0.05 + y * 0.1) * 6;
          if (x === 0) ctx.moveTo(x, y + offset);
          else ctx.lineTo(x, y + offset);
        }
        ctx.stroke();
      }
      break;
    }
    case 'patches': {
      const colors = furInfo.patchColors || ['#f4a460', '#2d2d2d'];
      for (let i = 0; i < 12; i++) {
        ctx.fillStyle = colors[i % colors.length];
        const px = Math.random() * 256;
        const py = Math.random() * 256;
        const r = 30 + Math.random() * 50;
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();
      }
      break;
    }
    case 'spots': {
      ctx.fillStyle = furInfo.spotColor || '#5c3d1a';
      for (let i = 0; i < 30; i++) {
        const px = Math.random() * 256;
        const py = Math.random() * 256;
        const r = 6 + Math.random() * 12;
        ctx.beginPath();
        ctx.ellipse(px, py, r, r * 0.7, Math.random() * Math.PI, 0, Math.PI * 2);
        ctx.fill();
      }
      break;
    }
    case 'tuxedo': {
      ctx.fillStyle = furInfo.base;
      ctx.fillRect(0, 0, 256, 256);
      // 白色胸腹
      ctx.fillStyle = furInfo.chestColor || '#fff';
      ctx.beginPath();
      ctx.ellipse(128, 180, 60, 90, 0, 0, Math.PI * 2);
      ctx.fill();
      // 白色口鼻
      ctx.beginPath();
      ctx.ellipse(128, 60, 50, 40, 0, 0, Math.PI * 2);
      ctx.fill();
      break;
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapU = THREE.RepeatWrapping;
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  return tex;
}

// ============================================================
// 猫模型构建
// ============================================================
function buildCat() {
  const cat = new THREE.Group();
  const furInfo = FUR_COLORS[furColor] || FUR_COLORS['Orange'];
  const eyeInfo = EYE_STYLES[eyeType] || EYE_STYLES['Original'];
  const faceInfo = FACE_EXPRESSIONS[faceType] || FACE_EXPRESSIONS['Smile'];

  const furTex = createFurTexture(furInfo);
  const bodyMat = new THREE.MeshStandardMaterial({
    map: furTex,
    color: hexToThree(furInfo.base),
    roughness: 0.65,
    metalness: 0.05,
  });
  const bodyMatPlain = new THREE.MeshStandardMaterial({
    color: hexToThree(furInfo.base),
    roughness: 0.65,
    metalness: 0.05,
  });

  // === 身体 ===
  const bodyGeom = new THREE.SphereGeometry(1, 32, 32);
  bodyGeom.scale(1, 1.35, 0.75);
  const body = new THREE.Mesh(bodyGeom, bodyMat);
  body.castShadow = true;
  cat.add(body);

  // === 头部 ===
  const headGeom = new THREE.SphereGeometry(0.62, 32, 32);
  const head = new THREE.Mesh(headGeom, bodyMat.clone());
  head.position.set(0, 1.25, 0.08);
  head.castShadow = true;
  cat.add(head);

  // 口鼻部 (白色区域)
  const muzzleGeom = new THREE.SphereGeometry(0.3, 24, 24);
  muzzleGeom.scale(1, 0.7, 0.4);
  const muzzleMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
  const muzzle = new THREE.Mesh(muzzleGeom, muzzleMat);
  muzzle.position.set(0, 1.05, 0.5);
  cat.add(muzzle);

  // === 耳朵 ===
  const earGeom = new THREE.ConeGeometry(0.14, 0.4, 8);
  const createEar = (x, zRot) => {
    const ear = new THREE.Mesh(earGeom, bodyMatPlain.clone());
    ear.position.set(x, 1.7, -0.05);
    ear.rotation.z = zRot;
    cat.add(ear);
    // 内耳粉色
    const innerGeom = new THREE.ConeGeometry(0.07, 0.25, 8);
    const innerMat = new THREE.MeshStandardMaterial({ color: 0xffb6c1, roughness: 0.5 });
    const inner = new THREE.Mesh(innerGeom, innerMat);
    inner.position.set(x, 1.66, 0.06);
    inner.rotation.z = zRot;
    cat.add(inner);
  };
  createEar(-0.33, -0.25);
  createEar(0.33, 0.25);

  // === 眼睛 ===
  const createEyes = () => {
    if (eyeInfo.isAccessory === 'sunglasses') {
      // 墨镜
      const lensGeom = new THREE.BoxGeometry(0.55, 0.18, 0.08);
      const lensMat = new THREE.MeshStandardMaterial({
        color: hexToThree(eyeInfo.lensColor || '#1a1a2e'),
        roughness: 0.2, metalness: 0.5,
      });
      const lens = new THREE.Mesh(lensGeom, lensMat);
      lens.position.set(0, 1.3, 0.55);
      lens.rotation.x = 0.15;
      cat.add(lens);
      return;
    }

    if (eyeInfo.isAccessory === 'vr_headset') {
      // VR 头显
      const vrGeom = new THREE.BoxGeometry(0.65, 0.35, 0.4);
      const vrMat = new THREE.MeshStandardMaterial({
        color: hexToThree(eyeInfo.headsetColor || '#444466'),
        roughness: 0.3, metalness: 0.4,
      });
      const vr = new THREE.Mesh(vrGeom, vrMat);
      vr.position.set(0, 1.28, 0.5);
      cat.add(vr);
      // 镜片发光
      const glowGeom = new THREE.BoxGeometry(0.2, 0.12, 0.05);
      const glowMat = new THREE.MeshStandardMaterial({ color: 0x00ff88, roughness: 0.1, metalness: 0.1, emissive: 0x00ff88, emissiveIntensity: 2 });
      const glowL = new THREE.Mesh(glowGeom, glowMat);
      glowL.position.set(-0.13, 1.28, 0.71);
      cat.add(glowL);
      const glowR = new THREE.Mesh(glowGeom, glowMat);
      glowR.position.set(0.13, 1.28, 0.71);
      cat.add(glowR);
      return;
    }

    // 标准眼睛
    const s = eyeInfo.size;
    for (const side of [-1, 1]) {
      const eyeWhiteGeom = new THREE.SphereGeometry(0.12 * s, 16, 16);
      const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 });
      const eyeWhite = new THREE.Mesh(eyeWhiteGeom, eyeWhiteMat);
      eyeWhite.position.set(side * 0.18, 1.3, 0.52);
      cat.add(eyeWhite);

      // 蓝色光环
      if (eyeInfo.ringColor) {
        const ringGeom = new THREE.TorusGeometry(0.12 * s, 0.02, 8, 16);
        const ringMat = new THREE.MeshStandardMaterial({
          color: hexToThree(eyeInfo.ringColor),
          roughness: 0.1, emissive: hexToThree(eyeInfo.ringColor), emissiveIntensity: 0.4,
        });
        const ring = new THREE.Mesh(ringGeom, ringMat);
        ring.position.copy(eyeWhite.position);
        cat.add(ring);
      }

      // 瞳孔
      const pupilGeom = new THREE.SphereGeometry(0.12 * s * eyeInfo.pupilSize * 2, 16, 16);
      const pupilMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
      const pupil = new THREE.Mesh(pupilGeom, pupilMat);
      pupil.position.set(side * 0.18, 1.3, 0.58);
      cat.add(pupil);

      // 高光
      const highlightGeom = new THREE.SphereGeometry(0.03 * s, 8, 8);
      const highlightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const highlight = new THREE.Mesh(highlightGeom, highlightMat);
      highlight.position.set(side * 0.18 + 0.04, 1.3 + 0.05, 0.62);
      cat.add(highlight);

      // 半闭眼 (Relaxed)
      if (eyeInfo.openRatio < 0.8) {
        const lidGeom = new THREE.BoxGeometry(0.28 * s, 0.18, 0.06);
        const lidMat = new THREE.MeshStandardMaterial({ color: hexToThree(furInfo.base), roughness: 0.7 });
        const lid = new THREE.Mesh(lidGeom, lidMat);
        lid.position.set(side * 0.18, 1.25, 0.54);
        cat.add(lid);
      }
    }

    // 眉毛 (表情驱动)
    if (faceInfo.eyeBrowAngle !== 0) {
      for (const side of [-1, 1]) {
        const browGeom = new THREE.BoxGeometry(0.15, 0.025, 0.04);
        const browMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
        const brow = new THREE.Mesh(browGeom, browMat);
        brow.position.set(side * 0.18, 1.45, 0.5);
        brow.rotation.z = faceInfo.eyeBrowAngle * side;
        cat.add(brow);
      }
    }
  };
  createEyes();

  // === 鼻子 ===
  const noseGeom = new THREE.SphereGeometry(0.06, 12, 12);
  noseGeom.scale(1, 0.7, 0.5);
  const noseMat = new THREE.MeshStandardMaterial({ color: 0xff69b4, roughness: 0.3 });
  const nose = new THREE.Mesh(noseGeom, noseMat);
  nose.position.set(0, 1.14, 0.6);
  cat.add(nose);

  // === 嘴巴 (表情驱动) ===
  const createMouth = () => {
    const mouthGroup = new THREE.Group();
    mouthGroup.position.set(0, 1.02, 0.55);
    const scale = faceInfo.mouthScale;

    switch (faceInfo.mouthType) {
      case 'smile': {
        const curve = new THREE.EllipseCurve(0, -0.02, 0.1 * scale, 0.06 * scale, Math.PI * 0.15, Math.PI * 0.85, false);
        const pts = curve.getPoints(20);
        const path = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p.x, p.y, 0)));
        const tubeGeom = new THREE.TubeGeometry(path, 20, 0.015, 8, false);
        const tubeMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5 });
        mouthGroup.add(new THREE.Mesh(tubeGeom, tubeMat));
        break;
      }
      case 'open': {
        const mouthGeom = new THREE.SphereGeometry(0.08 * scale, 16, 16);
        mouthGeom.scale(1, 0.6, 0.4);
        const mouthMat = new THREE.MeshStandardMaterial({ color: 0x2d0000, roughness: 0.5 });
        const mouth = new THREE.Mesh(mouthGeom, mouthMat);
        mouth.position.y = -0.03;
        mouthGroup.add(mouth);
        break;
      }
      case 'whistle': {
        const mouthGeom = new THREE.TorusGeometry(0.06 * scale, 0.02, 8, 16);
        const mouthMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5 });
        const mouth = new THREE.Mesh(mouthGeom, mouthMat);
        mouth.position.z = 0.02;
        mouthGroup.add(mouth);
        break;
      }
      case 'tongue': {
        // 先画嘴
        const mouthGeom = new THREE.SphereGeometry(0.07 * scale, 16, 16);
        mouthGeom.scale(1, 0.5, 0.3);
        const mouthMat = new THREE.MeshStandardMaterial({ color: 0x2d0000, roughness: 0.5 });
        const mouth = new THREE.Mesh(mouthGeom, mouthMat);
        mouth.position.y = -0.02;
        mouthGroup.add(mouth);
        // 舌头
        const tongueGeom = new THREE.SphereGeometry(0.04 * scale, 12, 12);
        tongueGeom.scale(0.7, 1.2, 0.3);
        const tongueMat = new THREE.MeshStandardMaterial({ color: 0xff6b8a, roughness: 0.4 });
        const tongue = new THREE.Mesh(tongueGeom, tongueMat);
        tongue.position.set(0, -0.06, 0.05);
        mouthGroup.add(tongue);
        break;
      }
    }
    cat.add(mouthGroup);
  };
  createMouth();

  // === 腮红 ===
  if (faceInfo.blushIntensity > 0) {
    for (const side of [-1, 1]) {
      const blushGeom = new THREE.CircleGeometry(0.1, 16);
      const blushMat = new THREE.MeshBasicMaterial({
        color: 0xff9999,
        transparent: true,
        opacity: faceInfo.blushIntensity * 0.5,
        side: THREE.DoubleSide,
      });
      const blush = new THREE.Mesh(blushGeom, blushMat);
      blush.position.set(side * 0.32, 1.15, 0.51);
      blush.rotation.x = -0.3;
      cat.add(blush);
    }
  }

  // === 胡须 ===
  for (const side of [-1, 1]) {
    for (let i = -1; i <= 1; i++) {
      const whiskerGeom = new THREE.CylinderGeometry(0.004, 0.004, 0.4, 6);
      const whiskerMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.5 });
      const whisker = new THREE.Mesh(whiskerGeom, whiskerMat);
      whisker.position.set(side * 0.22, 1.1 + i * 0.04, 0.5);
      whisker.rotation.z = Math.PI / 2;
      whisker.rotation.y = side * 0.3 + i * 0.1;
      cat.add(whisker);
    }
  }

  // === 腿 ===
  const legGeom = new THREE.CylinderGeometry(0.12, 0.15, 0.45, 12);
  const legPositions = [
    [-0.4, -1.1, 0.25], [0.4, -1.1, 0.25],
    [-0.35, -1.1, -0.3], [0.35, -1.1, -0.3],
  ];
  legPositions.forEach(([x, y, z]) => {
    const leg = new THREE.Mesh(legGeom, bodyMatPlain.clone());
    leg.position.set(x, y, z);
    leg.castShadow = true;
    cat.add(leg);

    // 爪子
    const pawGeom = new THREE.SphereGeometry(0.13, 10, 10);
    pawGeom.scale(1, 0.35, 1);
    const pawMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
    const paw = new THREE.Mesh(pawGeom, pawMat);
    paw.position.set(x, y - 0.25, z + 0.03);
    cat.add(paw);
  });

  // === 尾巴 ===
  const tailPath = [
    new THREE.Vector3(0, -0.6, -0.7),
    new THREE.Vector3(-0.3, -0.2, -1.0),
    new THREE.Vector3(-0.5, 0.3, -0.8),
    new THREE.Vector3(-0.4, 0.8, -0.4),
    new THREE.Vector3(-0.15, 1.1, -0.1),
  ];
  const tailCurve = new THREE.CatmullRomCurve3(tailPath);
  const tailGeom = new THREE.TubeGeometry(tailCurve, 30, 0.07, 10, false);
  const tail = new THREE.Mesh(tailGeom, bodyMat.clone());
  tail.castShadow = true;
  cat.add(tail);

  return { cat, furInfo };
}

// ============================================================
// 装备
// ============================================================
function addGear(cat) {
  if (!gearType) return;
  const gearModels = {
    'Baseball Cap': () => {
      const capGroup = new THREE.Group();
      const brimGeom = new THREE.CylinderGeometry(0.3, 0.32, 0.04, 16, 1, false, 0, Math.PI);
      const capMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.4 });
      const brim = new THREE.Mesh(brimGeom, capMat);
      brim.rotation.x = -0.2;
      brim.position.set(0, 0.02, 0.1);
      capGroup.add(brim);
      const domeGeom = new THREE.SphereGeometry(0.28, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2.3);
      const dome = new THREE.Mesh(domeGeom, capMat);
      dome.position.y = 0.05;
      capGroup.add(dome);
      capGroup.position.set(0, 1.85, 0.1);
      capGroup.rotation.x = -0.15;
      return capGroup;
    },
    'Camera': () => {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.12), new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.3 }));
      g.add(body);
      const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.08, 16), new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2, metalness: 0.5 }));
      lens.rotation.x = Math.PI / 2;
      lens.position.z = 0.1;
      g.add(lens);
      g.position.set(0, 0.1, 0.6);
      return g;
    },
    'Gold Round Glasses': () => {
      const g = new THREE.Group();
      for (const side of [-1, 1]) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.025, 8, 20), new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2, metalness: 0.8 }));
        ring.position.set(side * 0.18, 1.3, 0.56);
        g.add(ring);
      }
      const bridge = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.36, 8), new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2, metalness: 0.8 }));
      bridge.rotation.z = Math.PI / 2;
      bridge.position.set(0, 1.3, 0.56);
      g.add(bridge);
      return g;
    },
    'Good Luck Gold Bar': () => {
      const g = new THREE.Group();
      const bar = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.3), new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2, metalness: 0.9 }));
      g.add(bar);
      g.position.set(0.5, -0.2, 0.5);
      g.rotation.set(0.3, 0, 0.2);
      return g;
    },
    'Hiking Backpack': () => {
      const g = new THREE.Group();
      const pack = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.6, 0.3), new THREE.MeshStandardMaterial({ color: 0x27ae60, roughness: 0.5 }));
      g.add(pack);
      g.position.set(0, 0.3, -0.7);
      return g;
    },
    'Hot Coffee': () => {
      const g = new THREE.Group();
      const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.08, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 }));
      g.add(cup);
      const coffee = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.02, 16), new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.4 }));
      coffee.position.y = 0.1;
      g.add(coffee);
      g.position.set(0.5, -0.6, 0.5);
      return g;
    },
    'Investment Book': () => {
      const g = new THREE.Group();
      const book = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.25, 0.03), new THREE.MeshStandardMaterial({ color: 0xc0392b, roughness: 0.4 }));
      g.add(book);
      g.position.set(0.45, -0.5, 0.45);
      g.rotation.y = 0.4;
      return g;
    },
    'Ramen': () => {
      const g = new THREE.Group();
      const bowl = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16, 0, Math.PI * 2, 0, Math.PI / 1.8), new THREE.MeshStandardMaterial({ color: 0xe67e22, roughness: 0.4 }));
      g.add(bowl);
      g.position.set(0.45, -0.7, 0.4);
      return g;
    },
    'Sake': () => {
      const g = new THREE.Group();
      const bottle = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, 0.22, 12), new THREE.MeshStandardMaterial({ color: 0xecf0f1, roughness: 0.2, metalness: 0.1 }));
      g.add(bottle);
      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.08, 12), new THREE.MeshStandardMaterial({ color: 0xecf0f1, roughness: 0.2 }));
      neck.position.y = 0.15;
      g.add(neck);
      g.position.set(0.5, -0.5, 0.4);
      return g;
    },
    'Wealth Gold Bar': () => {
      const g = new THREE.Group();
      const bar = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.2, 0.35), new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.15, metalness: 0.95, emissive: 0xffd700, emissiveIntensity: 0.3 }));
      g.add(bar);
      g.position.set(-0.5, -0.2, 0.5);
      g.rotation.set(0.2, 0.3, 0.1);
      return g;
    },
  };

  const factory = gearModels[gearType];
  if (factory) {
    const gear = factory();
    cat.add(gear);
  }
}

// ============================================================
// Special 场景元素
// ============================================================
function addSpecialObjects(scene) {
  const sp = SPECIALS[special];
  if (!sp || !sp.objects) return;

  for (const obj of sp.objects) {
    switch (obj) {
      case 'dumbbell': {
        const g = new THREE.Group();
        const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.7, 8), new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.3, metalness: 0.6 }));
        g.add(bar);
        for (const s of [-1, 1]) {
          const w = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.15, 12), new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4 }));
          w.position.set(s * 0.42, 0, 0);
          g.add(w);
        }
        g.position.set(1.5, -1.0, 0.5);
        g.rotation.z = -0.4;
        scene.add(g);
        break;
      }
      case 'stars': {
        for (let i = 0; i < 50; i++) {
          const star = new THREE.Mesh(new THREE.SphereGeometry(0.02, 4, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
          star.position.set((Math.random() - 0.5) * 8, Math.random() * 5, -2 + Math.random() * 2);
          scene.add(star);
        }
        break;
      }
      case 'planet': {
        const planet = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 32), new THREE.MeshStandardMaterial({ color: 0x4a90d9, roughness: 0.5 }));
        planet.position.set(3, 2, -3);
        scene.add(planet);
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.06, 16, 48), new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.4, metalness: 0.6 }));
        ring.position.copy(planet.position);
        ring.rotation.x = Math.PI / 3;
        scene.add(ring);
        break;
      }
      case 'mountain': {
        const mt = new THREE.Mesh(new THREE.ConeGeometry(0.8, 2, 16), new THREE.MeshStandardMaterial({ color: 0x8fbc8f, roughness: 0.7 }));
        mt.position.set(2, -0.5, -3);
        scene.add(mt);
        const snow = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.3, 16), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 }));
        snow.position.set(2, 0.5, -3);
        scene.add(snow);
        break;
      }
      case 'lightning': {
        const boltGeom = new THREE.BufferGeometry();
        const boltPts = [new THREE.Vector3(1.5, 4, -2), new THREE.Vector3(1.3, 3, -2), new THREE.Vector3(1.7, 2, -2), new THREE.Vector3(1.4, 0.5, -2)];
        boltGeom.setFromPoints(boltPts);
        const bolt = new THREE.Line(boltGeom, new THREE.LineBasicMaterial({ color: 0xffff00, linewidth: 2 }));
        scene.add(bolt);
        break;
      }
      case 'clock': {
        const clock = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.04, 8, 20), new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.2, metalness: 0.7, emissive: 0xffd700, emissiveIntensity: 0.5 }));
        clock.position.set(-1.5, 1.5, -1);
        scene.add(clock);
        break;
      }
      case 'portal': {
        const portal = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.08, 16, 32), new THREE.MeshStandardMaterial({ color: 0x9944ff, roughness: 0.1, emissive: 0x9944ff, emissiveIntensity: 2 }));
        portal.position.set(-1.5, 0, -1);
        portal.rotation.y = Math.PI / 4;
        scene.add(portal);
        break;
      }
    }
  }
}

// ============================================================
// 背景设置
// ============================================================
function setBackground() {
  let bgInfo;

  if (special && !isFullScene) {
    // Special 非完整场景：使用 special 的天空色并添加地面
    const sp = SPECIALS[special];
    scene.background = hexToThree(sp.skyColor);
    if (sp.groundColor) {
      const groundGeom = new THREE.PlaneGeometry(20, 5);
      const groundMat = new THREE.MeshStandardMaterial({ color: hexToThree(sp.groundColor), roughness: 0.8 });
      const ground = new THREE.Mesh(groundGeom, groundMat);
      ground.position.set(0, -2.2, -2);
      ground.rotation.x = -0.5;
      ground.receiveShadow = true;
      scene.add(ground);
    }
    return;
  }

  if (isFullScene) {
    scene.background = hexToThree(SPECIALS[special].skyColor);
    return;
  }

  // 普通背景渐变
  bgInfo = BACKGROUNDS[bgType] || BACKGROUNDS['Blue Gradient'];
  const bgCanvas = document.createElement('canvas');
  bgCanvas.width = 2; bgCanvas.height = 512;
  const ctx = bgCanvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0, bgInfo.top);
  grad.addColorStop(1, bgInfo.bottom);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 2, 512);
  const bgTex = new THREE.CanvasTexture(bgCanvas);
  bgTex.colorSpace = THREE.SRGBColorSpace;
  bgTex.minFilter = THREE.LinearFilter;
  bgTex.magFilter = THREE.LinearFilter;
  scene.background = bgTex;
}

// ============================================================
// 组装 & 渲染
// ============================================================
const { cat } = buildCat();

if (!isFullScene) {
  addGear(cat);
}

scene.add(cat);

// 完整场景类型：移除猫，直接展示场景
if (isFullScene) {
  cat.visible = false;
}

setBackground();
addSpecialObjects(scene);

// 猫的微小旋转让视角更好
cat.rotation.y = 0.15;

// 渲染
renderer.render(scene, camera);

// 批量模式下通知 puppeteer 渲染完成
if (BATCH) {
  document.body.setAttribute('data-rendered', 'true');
  document.getElementById('info').textContent =
    `Fur:${furColor} | Eyes:${eyeType} | Face:${faceType} | Gear:${gearType||'None'} | BG:${bgType} | Special:${special||'None'}`;
}

// 如果非批量模式，预留给预览脚本的更新函数
window.__updateCat = function(newParams) {
  // 清空场景
  while(scene.children.length > 0) {
    scene.remove(scene.children[0]);
  }
  // 重新添加灯光
  scene.add(ambientLight);
  scene.add(keyLight);
  scene.add(fillLight);
  scene.add(rimLight);
};

console.log('✅ Cat 3D rendered:', { furColor, eyeType, faceType, gearType, bgType, special });
</script>
