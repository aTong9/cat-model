<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ramen Bowl — Three.js Reconstruction</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      overflow: hidden;
      height: 100vh;
      display: flex;
    }
    #canvas-container {
      flex: 1;
      position: relative;
    }
    canvas { display: block; }
    #ref-panel {
      width: 320px;
      background: #16213e;
      border-left: 1px solid #0f3460;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      gap: 16px;
    }
    #ref-panel h2 {
      font-size: 16px;
      font-weight: 600;
      color: #e94560;
      text-align: center;
    }
    #ref-panel img {
      width: 100%;
      max-width: 280px;
      border-radius: 8px;
      border: 2px solid #0f3460;
      image-rendering: auto;
    }
    .info {
      font-size: 12px;
      color: #aaa;
      text-align: center;
      line-height: 1.5;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .controls button {
      background: #0f3460;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }
    .controls button:hover { background: #e94560; }
    .controls button.active { background: #e94560; }
    .legend {
      font-size: 11px;
      color: #888;
      margin-top: auto;
      text-align: center;
    }
    .legend span { display: inline-block; margin: 2px 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="ref-panel">
    <h2>Reference Image</h2>
    <img src="ramen.png" alt="Ramen Bowl Reference" id="ref-img">
    <div class="info">
      3D Cartoon Ramen Bowl<br>
      Ceramic · Noodles · Egg · Nori · Scallions
    </div>
    <div class="controls">
      <button id="btn-front" class="active">Front</button>
      <button id="btn-34">3/4 View</button>
      <button id="btn-side">Side</button>
      <button id="btn-top">Top</button>
      <button id="btn-spin">Auto Spin</button>
    </div>
    <div class="legend">
      <span><span class="dot" style="background:#F5F5F5"></span>Ceramic</span>
      <span><span class="dot" style="background:#FFCA28"></span>Noodles</span>
      <span><span class="dot" style="background:#4CAF50"></span>Scallion</span>
    </div>
    <div class="info" style="margin-top:8px;">
      Drag to orbit · Scroll to zoom<br>
      Right-click to pan
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const container = document.getElementById('canvas-container');

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#2a2a4a');
    scene.fog = new THREE.Fog('#2a2a4a', 10, 25);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 1.5, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.2, 0);
    controls.minDistance = 2;
    controls.maxDistance = 12;

    // Lighting
    const ambientLight = new THREE.AmbientLight('#606080', 0.5);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight('#FFF5E0', 1.3);
    keyLight.position.set(4, 6, 5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 1024;
    keyLight.shadow.mapSize.height = 1024;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 20;
    keyLight.shadow.bias = -0.001;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight('#C8D8FF', 0.4);
    fillLight.position.set(-4, 3, -2);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight('#FFE8C0', 0.5);
    rimLight.position.set(-2, 4, -5);
    scene.add(rimLight);

    const bottomBounce = new THREE.DirectionalLight('#FFE0C0', 0.15);
    bottomBounce.position.set(0, -3, 2);
    scene.add(bottomBounce);

    // Ground
    const groundGeo = new THREE.PlaneGeometry(20, 20);
    const groundMat = new THREE.ShadowMaterial({ opacity: 0.15 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.0;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(10, 20, '#3a3a5a', '#2a2a4a');
    grid.position.y = -1.0;
    scene.add(grid);

    // ===================== BOWL PATTERN TEXTURE =====================
    function createBowlPatternTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // White background
      ctx.fillStyle = '#F5F5F5';
      ctx.fillRect(0, 0, 1024, 256);

      // Red border lines
      ctx.fillStyle = '#E53935';
      ctx.fillRect(0, 10, 1024, 8);
      ctx.fillRect(0, 238, 1024, 8);

      const units = 8;
      const uw = 1024 / units;
      const s = 70;
      const cy = 128;

      ctx.strokeStyle = '#E53935';
      ctx.lineWidth = 12;
      ctx.lineJoin = 'miter';

      // Draw continuous meander pattern
      ctx.beginPath();
      for (let i = 0; i < units; i++) {
        const cx = i * uw + uw / 2;
        const left = cx - s;
        const right = cx + s;
        const top = cy - s;
        const bottom = cy + s;
        const inset = s * 0.42;

        if (i === 0) {
          ctx.moveTo(left, top);
        } else {
          ctx.lineTo(left, top);
        }

        // Outer frame
        ctx.lineTo(right, top);
        ctx.lineTo(right, bottom);
        ctx.lineTo(left + inset, bottom);

        // Inner turn
        ctx.lineTo(left + inset, top + inset);
        ctx.lineTo(right - inset, top + inset);

        // Connect to next unit
        if (i < units - 1) {
          ctx.lineTo(right - inset, bottom);
          ctx.moveTo(right, bottom);
        } else {
          // Last unit - close inner
          ctx.lineTo(right - inset, bottom);
          ctx.lineTo(left + inset, bottom);
          ctx.lineTo(left + inset, top + inset);
        }
      }
      ctx.stroke();

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // ===================== MATERIALS =====================
    const ceramicMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color('#F5F5F5'),
      roughness: 0.25,
      metalness: 0.05,
    });

    const innerCeramicMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color('#E8E8E8'),
      roughness: 0.3,
      metalness: 0.05,
      side: THREE.BackSide,
    });

    const patternMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color('#FFFFFF'),
      map: createBowlPatternTexture(),
      roughness: 0.3,
      metalness: 0.05,
      transparent: true,
    });

    const noodleMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color('#FFCA28'),
      roughness: 0.65,
      metalness: 0.0,
    });

    const noodleShadowMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color('#E6B000'),
      roughness: 0.7,
      metalness: 0.0,
    });

    const eggWhiteMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color('#FAFAFA'),
      roughness: 0.3,
      metalness: 0.0,
    });

    const yolkMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color('#FFEB3B'),
      roughness: 0.5,
      metalness: 0.0,
    });

    const noriMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color('#2E2E2E'),
      roughness: 0.95,
      metalness: 0.0,
    });

    const scallionMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color('#4CAF50'),
      roughness: 0.5,
      metalness: 0.0,
    });

    const chopstickMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color('#795548'),
      roughness: 0.5,
      metalness: 0.0,
    });

    const goldMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color('#FFC107'),
      roughness: 0.2,
      metalness: 0.9,
    });

    // ===================== RAMEN BOWL GROUP =====================
    const ramen = new THREE.Group();
    ramen.name = 'ramenBowl';

    // ---- Bowl exterior (Lathe) ----
    const bowlPoints = [
      new THREE.Vector2(0, -0.75),
      new THREE.Vector2(0.35, -0.75),
      new THREE.Vector2(0.42, -0.6),
      new THREE.Vector2(0.55, -0.45),
      new THREE.Vector2(0.72, -0.2),
      new THREE.Vector2(0.9, 0.1),
      new THREE.Vector2(1.05, 0.35),
      new THREE.Vector2(1.15, 0.48),
      new THREE.Vector2(1.2, 0.52),
      new THREE.Vector2(1.22, 0.54),
    ];
    const bowlGeo = new THREE.LatheGeometry(bowlPoints, 64);
    const bowl = new THREE.Mesh(bowlGeo, ceramicMat);
    bowl.castShadow = true;
    bowl.receiveShadow = true;
    bowl.name = 'bowlBody';
    ramen.add(bowl);

    // ---- Bowl interior ----
    const innerPoints = [
      new THREE.Vector2(0, -0.4),
      new THREE.Vector2(0.48, -0.4),
      new THREE.Vector2(0.62, -0.25),
      new THREE.Vector2(0.78, 0.0),
      new THREE.Vector2(0.92, 0.25),
      new THREE.Vector2(1.03, 0.45),
      new THREE.Vector2(1.1, 0.5),
    ];
    const innerGeo = new THREE.LatheGeometry(innerPoints, 64);
    const innerBowl = new THREE.Mesh(innerGeo, innerCeramicMat);
    innerBowl.name = 'bowlInterior';
    ramen.add(innerBowl);

    // ---- Bowl bottom disc ----
    const bottomGeo = new THREE.CircleGeometry(0.35, 32);
    const bottomMat = new THREE.MeshStandardMaterial({
      color: '#E0E0E0', roughness: 0.3, metalness: 0.05
    });
    const bottomDisc = new THREE.Mesh(bottomGeo, bottomMat);
    bottomDisc.rotation.x = -Math.PI / 2;
    bottomDisc.position.y = -0.75;
    ramen.add(bottomDisc);

    // ---- Pattern band (cylinder decal) ----
    // Pattern sits on bowl at y ≈ -0.05 to 0.35
    const bandGeo = new THREE.CylinderGeometry(1.07, 0.88, 0.42, 64, 1, true);
    const band = new THREE.Mesh(bandGeo, patternMat);
    band.position.y = 0.15;
    band.scale.set(1.005, 1, 1.005); // Slightly outside bowl
    band.name = 'patternBand';
    ramen.add(band);

    // ---- Noodles ----
    function createNoodle(curvePoints, radius = 0.065) {
      const curve = new THREE.CatmullRomCurve3(curvePoints);
      const geo = new THREE.TubeGeometry(curve, 24, radius, 10, false);
      const mesh = new THREE.Mesh(geo, noodleMat);
      mesh.castShadow = true;
      return mesh;
    }

    const noodleCurves = [
      // Front-left
      [
        new THREE.Vector3(-0.55, -0.05, 0.35),
        new THREE.Vector3(-0.35, 0.2, 0.3),
        new THREE.Vector3(-0.15, 0.45, 0.2),
        new THREE.Vector3(0.05, 0.55, 0.1),
      ],
      // Front-center
      [
        new THREE.Vector3(-0.25, -0.1, 0.4),
        new THREE.Vector3(-0.05, 0.15, 0.35),
        new THREE.Vector3(0.15, 0.4, 0.25),
        new THREE.Vector3(0.35, 0.5, 0.15),
      ],
      // Front-right
      [
        new THREE.Vector3(0.05, -0.05, 0.38),
        new THREE.Vector3(0.25, 0.2, 0.3),
        new THREE.Vector3(0.45, 0.42, 0.2),
        new THREE.Vector3(0.55, 0.52, 0.1),
      ],
      // Back-left
      [
        new THREE.Vector3(-0.45, 0.0, -0.15),
        new THREE.Vector3(-0.25, 0.25, -0.1),
        new THREE.Vector3(-0.05, 0.5, 0.0),
        new THREE.Vector3(0.15, 0.6, 0.05),
      ],
      // Back-center
      [
        new THREE.Vector3(-0.15, 0.05, -0.25),
        new THREE.Vector3(0.05, 0.3, -0.15),
        new THREE.Vector3(0.25, 0.55, -0.05),
        new THREE.Vector3(0.4, 0.62, 0.05),
      ],
      // Back-right
      [
        new THREE.Vector3(0.15, 0.0, -0.2),
        new THREE.Vector3(0.35, 0.25, -0.1),
        new THREE.Vector3(0.5, 0.48, 0.0),
        new THREE.Vector3(0.6, 0.55, 0.1),
      ],
      // Center mound
      [
        new THREE.Vector3(-0.3, 0.1, 0.1),
        new THREE.Vector3(-0.1, 0.35, 0.15),
        new THREE.Vector3(0.1, 0.55, 0.1),
        new THREE.Vector3(0.3, 0.5, 0.0),
      ],
    ];

    noodleCurves.forEach((pts, i) => {
      const r = 0.06 + (i % 3) * 0.01;
      const noodle = createNoodle(pts, r);
      noodle.name = `noodle${i}`;
      ramen.add(noodle);
    });

    // ---- Egg (halved) ----
    const eggGroup = new THREE.Group();
    eggGroup.name = 'egg';

    // Egg white - half sphere
    const eggWhiteGeo = new THREE.SphereGeometry(0.32, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
    const eggWhite = new THREE.Mesh(eggWhiteGeo, eggWhiteMat);
    eggWhite.castShadow = true;
    eggGroup.add(eggWhite);

    // Yolk - smaller half sphere, slightly flattened
    const yolkGeo = new THREE.SphereGeometry(0.16, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2);
    const yolk = new THREE.Mesh(yolkGeo, yolkMat);
    yolk.position.y = 0.06;
    yolk.scale.set(1, 0.6, 1);
    eggGroup.add(yolk);

    // Yolk highlight (subtle brighter spot)
    const yolkHighlightGeo = new THREE.SphereGeometry(0.06, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2);
    const yolkHighlightMat = new THREE.MeshStandardMaterial({
      color: '#FFF176',
      roughness: 0.4,
      metalness: 0,
      transparent: true,
      opacity: 0.5,
    });
    const yolkHighlight = new THREE.Mesh(yolkHighlightGeo, yolkHighlightMat);
    yolkHighlight.position.set(0.04, 0.1, 0.04);
    yolkHighlight.scale.set(1, 0.5, 1);
    eggGroup.add(yolkHighlight);

    eggGroup.position.set(0.35, 0.42, 0.15);
    eggGroup.rotation.set(-0.2, 0.3, 0.1);
    ramen.add(eggGroup);

    // ---- Nori (seaweed sheets) ----
    const noriGeo = new THREE.BoxGeometry(0.55, 0.015, 0.42);

    const nori1 = new THREE.Mesh(noriGeo, noriMat);
    nori1.position.set(-0.25, 0.72, -0.15);
    nori1.rotation.set(0.15, 0.25, -0.08);
    nori1.castShadow = true;
    nori1.name = 'nori1';
    ramen.add(nori1);

    const nori2 = new THREE.Mesh(noriGeo, noriMat);
    nori2.position.set(0.15, 0.78, -0.2);
    nori2.rotation.set(0.1, -0.15, 0.12);
    nori2.castShadow = true;
    nori2.name = 'nori2';
    ramen.add(nori2);

    // ---- Scallions (green onion rings) ----
    const scallionGeo = new THREE.TorusGeometry(0.04, 0.014, 8, 16);

    const scallionPositions = [
      { pos: [-0.15, 0.62, 0.22], rot: [0.3, 0.5, 0.2] },
      { pos: [0.1, 0.68, 0.18], rot: [0.1, 1.2, 0.4] },
      { pos: [-0.35, 0.58, 0.05], rot: [0.5, 0.3, 0.1] },
      { pos: [0.25, 0.65, 0.0], rot: [0.2, 2.0, 0.3] },
      { pos: [-0.05, 0.72, -0.05], rot: [0.4, 0.8, 0.5] },
      { pos: [0.45, 0.6, 0.12], rot: [0.1, 0.2, 0.6] },
    ];

    scallionPositions.forEach((s, i) => {
      const scallion = new THREE.Mesh(scallionGeo, scallionMat);
      scallion.position.set(...s.pos);
      scallion.rotation.set(...s.rot);
      scallion.castShadow = true;
      scallion.name = `scallion${i}`;
      ramen.add(scallion);
    });

    // ---- Chopsticks ----
    const chopstickGeo = new THREE.CylinderGeometry(0.022, 0.016, 3.0, 10);

    const chopstick1 = new THREE.Mesh(chopstickGeo, chopstickMat);
    chopstick1.rotation.z = Math.PI / 2;
    chopstick1.rotation.y = 0.04;
    chopstick1.position.set(0, 0.7, 0.42);
    chopstick1.castShadow = true;
    ramen.add(chopstick1);

    const chopstick2 = new THREE.Mesh(chopstickGeo, chopstickMat);
    chopstick2.rotation.z = Math.PI / 2;
    chopstick2.rotation.y = -0.02;
    chopstick2.position.set(0, 0.67, 0.38);
    chopstick2.castShadow = true;
    ramen.add(chopstick2);

    // Gold rings on chopsticks
    const ringGeo = new THREE.CylinderGeometry(0.026, 0.026, 0.05, 12);

    const ring1 = new THREE.Mesh(ringGeo, goldMat);
    ring1.rotation.z = Math.PI / 2;
    ring1.position.set(1.0, 0.7, 0.42);
    ramen.add(ring1);

    const ring2 = new THREE.Mesh(ringGeo, goldMat);
    ring2.rotation.z = Math.PI / 2;
    ring2.position.set(1.0, 0.67, 0.38);
    ramen.add(ring2);

    // ---- Soup surface (subtle) ----
    const soupGeo = new THREE.CircleGeometry(0.95, 32);
    const soupMat = new THREE.MeshStandardMaterial({
      color: '#C8A050',
      roughness: 0.3,
      metalness: 0.1,
      transparent: true,
      opacity: 0.35,
    });
    const soup = new THREE.Mesh(soupGeo, soupMat);
    soup.rotation.x = -Math.PI / 2;
    soup.position.y = 0.05;
    ramen.add(soup);

    scene.add(ramen);

    // ===================== VIEW CONTROLS =====================
    const views = {
      front: { pos: [0, 1.0, 4.5], target: [0, 0.2, 0] },
      '34': { pos: [3.0, 2.0, 3.0], target: [0, 0.2, 0] },
      side: { pos: [4.5, 1.0, 0], target: [0, 0.2, 0] },
      top: { pos: [0, 5.0, 0.3], target: [0, 0.2, 0] },
    };

    function animateCamera(pos, target) {
      const startPos = camera.position.clone();
      const endPos = new THREE.Vector3(...pos);
      const startTarget = controls.target.clone();
      const endTarget = new THREE.Vector3(...target);
      let t = 0;
      function step() {
        t += 0.04;
        if (t >= 1) {
          camera.position.copy(endPos);
          controls.target.copy(endTarget);
          return;
        }
        const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        camera.position.lerpVectors(startPos, endPos, ease);
        controls.target.lerpVectors(startTarget, endTarget, ease);
        requestAnimationFrame(step);
      }
      step();
    }

    function setActive(id) {
      document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    document.getElementById('btn-front').onclick = () => {
      animateCamera(views.front.pos, views.front.target);
      setActive('btn-front');
    };
    document.getElementById('btn-34').onclick = () => {
      animateCamera(views['34'].pos, views['34'].target);
      setActive('btn-34');
    };
    document.getElementById('btn-side').onclick = () => {
      animateCamera(views.side.pos, views.side.target);
      setActive('btn-side');
    };
    document.getElementById('btn-top').onclick = () => {
      animateCamera(views.top.pos, views.top.target);
      setActive('btn-top');
    };

    let autoSpin = false;
    document.getElementById('btn-spin').onclick = () => {
      autoSpin = !autoSpin;
      document.getElementById('btn-spin').classList.toggle('active');
    };

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);
      if (autoSpin) {
        ramen.rotation.y += 0.006;
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
